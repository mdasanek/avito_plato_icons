<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="description" content="Пикселизация SVG и PNG. Шаг 5 или 10 px. Экспорт 200×200 в PNG и SVG.">
  <title>Plato</title>
  <link rel="icon" type="image/svg+xml" href="./src/assets/cat.svg">
  <link rel="stylesheet" href="./src/style.css?v=3">
  <script type="module" src="./src/app.js?v=3"></script>
</head>
<body>
  <header class="header"><a href="./" aria-label="Plato — главная"><img class="logo" src="./src/assets/cat.svg" width="66" height="37" alt="Plato — кот"></a></header>
  <main class="editor" aria-label="Пикселизация иконок">
    <div class="previews" id="upload-zone" aria-label="Перетащите сюда SVG или PNG 100×100 или 200×200 px">
      <div class="preview"><canvas id="original" width="200" height="200" aria-label="Исходная иконка"></canvas></div>
      <span class="preview-arrow" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div class="preview"><canvas id="result" width="200" height="200" aria-label="Пикселизированная иконка"></canvas></div>
    </div>
    <div class="toolbar">
      <fieldset class="step-options"><legend class="visually-hidden">Размер пикселя</legend><label><input type="radio" name="step" value="5" checked><span>5 px</span></label><label><input type="radio" name="step" value="10"><span>10 px</span></label></fieldset>
      <button class="upload-button" id="upload-button"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 13V3M6 7l4-4 4 4M4 14v3h12v-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Загрузить</button>
      <div class="downloads"><button id="download-png" aria-label="Скачать PNG">PNG<svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v10m-4-4 4 4 4-4M4 14v3h12v-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="download-svg" aria-label="Скачать SVG">SVG<svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v10m-4-4 4 4 4-4M4 14v3h12v-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    </div>
    <input class="visually-hidden" id="file-input" type="file" accept="image/svg+xml,image/png,.svg,.png" aria-label="Загрузить SVG или PNG, 100×100 или 200×200 px, до 5 МБ">
    <p class="feedback" id="feedback" role="alert" hidden></p>
  </main>
</body>
</html>
